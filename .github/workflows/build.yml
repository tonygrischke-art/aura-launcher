name: Build and Release Debug APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, "audit/**", phase3b-video-orb, phase3c-wire-orb, phase4a-nim-client, phase4-backend-router, phase5-wake-word, integration/**, feat/wake-word]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: aura-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Assemble debug APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install NDK and CMake

        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1"'


      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK (auto-signed with debug keystore)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run lint
        run: |
          ./gradlew lint --no-daemon --stacktrace

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Publish APK to GitHub Release (tag = short commit hash)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          TAG="aura-$SHORT"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mv "$APK" "aura-debug-$SHORT.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "aura-debug-$SHORT.apk" --clobber
          else
            gh release create "$TAG" "aura-debug-$SHORT.apk" --target "$GITHUB_SHA" \
              --title "Aura $SHORT" \
              --notes "Debug build from commit $SHORT (CI-assembled, debug-signed). Asset: aura-debug-$SHORT.apk"
          fi
