name: Build Debug APK

on:
  push:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Print build log tail
        if: always()
        run: |
          echo "=== LAST 40 LINES OF BUILD LOG ==="
          tail -40 /home/runner/work/_temp/_github_workflow_build.log 2>/dev/null || echo "Log file not found, showing recent output from runner"