name: Build and Release Debug APK

on:
  push:
    branches: [main, phase3b-video-orb]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Assemble debug APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
      DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
      DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode debug keystore from secret
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          echo "DEBUG_KEYSTORE_PATH=$(pwd)/debug.keystore" >> $GITHUB_ENV

      - name: Log keystore source
        run: |
          if [ -n "$DEBUG_KEYSTORE_PATH" ]; then
            echo "Using secrets keystore from GitHub secrets"
          else
            echo "Using fallback debug keystore (auto-generated)"
          fi

      - name: Build debug APK (tee output to ci-log.txt)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ci-log.txt

      - name: Upload build log artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci-log.txt
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish APK to GitHub Release (tag = short commit hash)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          TAG="aura-$SHORT"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mv "$APK" "aura-debug-$SHORT.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "aura-debug-$SHORT.apk" --clobber
          else
            gh release create "$TAG" "aura-debug-$SHORT.apk" --target "$GITHUB_SHA" \
              --title "Aura $SHORT" \
              --notes "Debug build from commit $SHORT (CI-assembled, debug-signed). Asset: aura-debug-$SHORT.apk"
          fi